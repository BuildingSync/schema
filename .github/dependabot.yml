version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # One PR per month for routine version bumps
      python-deps:
        applies-to: version-updates
        patterns:
          - "*"
      # One PR for security fixes (these are not limited by the schedule or cooldown)
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "ignore"
      - "Schema: No Changes"
      - "Non-breaking Change"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ignore"
      - "Schema: No Changes"
      - "Non-breaking Change"
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      ruby-deps:
        applies-to: version-updates
        patterns:
          - "*"
      ruby-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "ignore"
      - "Schema: No Changes"
      - "Non-breaking Change"
